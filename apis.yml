aid: finova
name: Finova Capital
description: 'Finova Capital is a non-banking financial company (NBFC) licensed by the Reserve
  Bank of India, founded in 2015 by Mohit Sahney and Sunita Sahney and headquartered in Jaipur,
  Rajasthan. It provides secured lending to micro, small and medium enterprises (MSMEs) and
  self-employed customers across India, including MSME business loans, home loans, working
  capital and machinery loans, and personal loans, all secured against immovable property.
  Operating across 17 states through 450+ branches, Finova Capital is backed by investors
  including Peak XV Partners, Norwest Venture Partners, Faering Capital, Maj Invest, Sofina
  Ventures, Avataar Ventures and Madison India Capital. The company holds a Certificate of
  Registration issued by the RBI under Section 45-IA of the Reserve Bank of India Act, 1934.
  This is a financial-services provider with a public marketing and investor-relations website;
  it does not currently expose a public developer API surface.'
